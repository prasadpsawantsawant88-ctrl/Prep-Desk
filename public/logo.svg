<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#183828"/>
      <stop offset="100%" stop-color="#0e271a"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdbd71"/>
      <stop offset="50%" stop-color="#d49439"/>
      <stop offset="100%" stop-color="#835411"/>
    </linearGradient>
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="84" fill="none" stroke="url(#goldGrad)" stroke-width="8" opacity="0.6"/>

  <!-- Executive Crest Frame -->
  <path d="M 256 90 L 380 140 V 270 C 380 350 320 405 256 430 C 192 405 132 350 132 270 V 140 Z" fill="#224734" stroke="url(#goldGrad)" stroke-width="6" filter="url(#glow)"/>

  <!-- Monogram P & Executive Quill Icon -->
  <g transform="translate(190, 150) scale(1.2)">
    <!-- Vertical Stem -->
    <rect x="10" y="20" width="22" height="150" rx="6" fill="url(#goldGrad)"/>
    
    <!-- P Loop -->
    <path d="M 22 20 H 65 C 92 20 110 38 110 65 C 110 92 92 110 65 110 H 22 Z" fill="none" stroke="url(#goldGrad)" stroke-width="22" stroke-linejoin="round" stroke-linecap="round"/>
    
    <!-- Quill Nib Accent inside P -->
    <path d="M 50 45 L 80 65 L 50 85 Z" fill="#ffffff" opacity="0.9"/>
  </g>
</svg>
